name: Build SpaceBasic APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Project, Icon & Full Editor
        run: |
          flutter create --platforms=android --org com.spacebasic.app --project-name spacebasic /tmp/app_build
          rm -rf /tmp/app_build/test
          python3 - << 'PYEOF'
          import os, shutil, glob, zlib, struct

          target_lib = "/tmp/app_build/lib"
          os.makedirs(target_lib, exist_ok=True)

          # 1. Copy all .dart files from repo into /tmp/app_build/lib
          for root, dirs, files in os.walk("."):
              if "/tmp/app_build" in root:
                  continue
              for f in files:
                  name = f.lower().strip()
                  if name.endswith(".dart"):
                      shutil.copy(os.path.join(root, f), os.path.join(target_lib, name))

          # 2. Ensure AnnouncementEntry exists in app_data.dart
          app_data_path = os.path.join(target_lib, "app_data.dart")
          if os.path.exists(app_data_path):
              with open(app_data_path, "r", encoding="utf-8") as fp:
                  acode = fp.read()
              if "AnnouncementEntry" not in acode:
                  addon = """
          class AnnouncementEntry {
            String category;
            String priority;
            String message;
            String author;
            String dateTime;
            AnnouncementEntry({required this.category, required this.priority, required this.message, required this.author, required this.dateTime});
            Map<String, dynamic> toJson() => {'category': category, 'priority': priority, 'message': message, 'author': author, 'dateTime': dateTime};
            factory AnnouncementEntry.fromJson(Map<String, dynamic> j) => AnnouncementEntry(category: j['category'] ?? 'GENERAL', priority: j['priority'] ?? 'Medium', message: j['message'] ?? '', author: j['author'] ?? 'Kumar S', dateTime: j['dateTime'] ?? '14 Oct 2026, 04:33 PM');
          }
          """
                  acode = acode.replace("class AppData extends ChangeNotifier {", addon + "\nclass AppData extends ChangeNotifier {\n  List<AnnouncementEntry> announcements = [\n    AnnouncementEntry(category: 'GENERAL', priority: 'Medium', message: 'Dear Residents, Students who have not yet received their Permanent ID Card are requested to meet their respective floor...', author: 'Kumar S', dateTime: '14 Oct 2026, 04:33 PM'),\n    AnnouncementEntry(category: 'GENERAL', priority: 'Medium', message: '*IMPORTANT SAFETY ADVISORY – ZERO TOLERANCE* Dear Students, Two serious safety violations have been reported in...', author: 'Kumar S', dateTime: '09 Oct 2026, 08:09 AM'),\n    AnnouncementEntry(category: 'GENERAL', priority: 'Medium', message: '⚠️ CRITICAL FOOD SAFETY ADVISORY\\nDear Students, A serious food-safety concern has been flagged at the...', author: 'Kumar S', dateTime: '07 Oct 2026, 10:59 AM'),\n  ];\n")
                  with open(app_data_path, "w", encoding="utf-8") as fp:
                      fp.write(acode)

          # 3. Fix '$' syntax error and expand SecretEditorScreen in profile_notifications.dart
          prof_path = os.path.join(target_lib, "profile_notifications.dart")
          if os.path.exists(prof_path):
              with open(prof_path, "r", encoding="utf-8") as fp:
                  pcode = fp.read()
              pcode = pcode.replace("@ $ !", r"@ \$ !")
              marker = "class SecretEditorScreen extends StatefulWidget"
              if marker in pcode:
                  pcode = pcode[:pcode.index(marker)] + r'''class SecretEditorScreen extends StatefulWidget {
            const SecretEditorScreen({super.key});
            @override
            State<SecretEditorScreen> createState() => _SecretEditorScreenState();
          }

          class _SecretEditorScreenState extends State<SecretEditorScreen> {
            @override
            Widget build(BuildContext context) {
              final d = AppData.instance;
              return Scaffold(
                backgroundColor: AppColors.bgGrey,
                appBar: AppBar(
                  backgroundColor: Colors.white,
                  elevation: 0,
                  leading: IconButton(
                    icon: const Icon(Icons.arrow_back, color: AppColors.textDark),
                    onPressed: () { d.notifyAndSave(); Navigator.pop(context); },
                  ),
                  title: const Text('Edit All App Info', style: TextStyle(color: AppColors.textDark, fontSize: 18, fontWeight: FontWeight.w600)),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.restore, color: AppColors.signOutRed),
                      onPressed: () { d.resetToDefaults(); setState(() {}); },
                    ),
                  ],
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      _sec('1. HOME & HEADER (NAME, DAY & DATE)'),
                      _box([
                        _f('University Name', d.universityName, (v) => d.universityName = v),
                        _f('Greeting (e.g. Good morning, SYED)', d.greetingText, (v) => d.greetingText = v),
                        _f('Day & Date (e.g. Thursday 15 October)', d.homeDateText, (v) => d.homeDateText = v),
                        _f('Notification Badge Number', d.notificationBadge, (v) => d.notificationBadge = v),
                      ]),
                      _sec('2. STUDENT & HOSTEL INFO'),
                      _box([
                        _f('Student Full Name', d.studentName, (v) => d.studentName = v),
                        _f('Student Gmail', d.studentEmail, (v) => d.studentEmail = v),
                        _f('Student Mobile Number', d.studentMobile, (v) => d.studentMobile = v),
                        _f('Gender', d.gender, (v) => d.gender = v),
                        _f('DOB', d.dob, (v) => d.dob = v),
                        _f('Hostel Name', d.hostelName, (v) => d.hostelName = v),
                        _f('Block Name', d.blockName, (v) => d.blockName = v),
                        _f('Room Number', d.roomNumber, (v) => d.roomNumber = v),
                        _f('Floor', d.floor, (v) => d.floor = v),
                      ]),
                      _sec('3. PARENTS INFORMATION'),
                      _box([
                        _f('Parent Name', d.parentName, (v) => d.parentName = v),
                        _f('Parent Mobile', d.parentMobile, (v) => d.parentMobile = v),
                        _f('Parent Gmail', d.parentEmail, (v) => d.parentEmail = v),
                        _f('Parent Address', d.parentAddress, (v) => d.parentAddress = v),
                        _f('Occupation', d.parentOccupation, (v) => d.parentOccupation = v),
                        _f('City', d.parentCity, (v) => d.parentCity = v),
                      ]),
                      _sec('4. PREVIOUS LEAVES & DATES'),
                      _box([_f('Total Leaves Text', d.totalLeavesText, (v) => d.totalLeavesText = v)]),
                      ...List.generate(d.leaves.length, (i) {
                        final lv = d.leaves[i];
                        return _box([
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Text('Leave #${i + 1}', style: const TextStyle(fontWeight: FontWeight.w700)),
                              IconButton(icon: const Icon(Icons.delete_outline, color: AppColors.signOutRed), onPressed: () => setState(() => d.leaves.removeAt(i))),
                            ],
                          ),
                          _f('Status (Completed / Partially Approved)', lv.status, (v) => lv.status = v),
                          _f('Leave Type', lv.leaveType, (v) => lv.leaveType = v),
                          _f('Approval Subtitle', lv.approvalSubtitle, (v) => lv.approvalSubtitle = v),
                          _f('Out Date', lv.outDate, (v) => lv.outDate = v),
                          _f('Out Time', lv.outTime, (v) => lv.outTime = v),
                          _f('Back Date', lv.backDate, (v) => lv.backDate = v),
                          _f('Back Time', lv.backTime, (v) => lv.backTime = v),
                          _f('Duration', lv.duration, (v) => lv.duration = v),
                          _f('Reason', lv.reason, (v) => lv.reason = v),
                          _f('Applied On Date/Time', lv.appliedOn, (v) => lv.appliedOn = v),
                          _f('Approvals (e.g. 2 of 2)', lv.approvals, (v) => lv.approvals = v),
                        ]);
                      }),
                      OutlinedButton.icon(
                        onPressed: () => setState(() => d.leaves.add(LeaveItem(status: 'Completed', leaveType: 'Home Out New', approvalSubtitle: 'Warden Approved', outDate: '12 Oct 2026', outTime: '05:00 PM', duration: '16 hours', backDate: '13 Oct 2026', backTime: '09:00 AM', reason: 'Others', appliedOn: '12 Oct 2026 04:55PM', approvals: '2 of 2'))),
                        icon: const Icon(Icons.add),
                        label: const Text('Add Leave Card'),
                      ),
                      _sec('5. NOTIFICATIONS & DATES'),
                      ...List.generate(d.notifications.length, (i) {
                        final n = d.notifications[i];
                        return _box([
                          Text(n.isSecretEditor ? 'Notification #${i + 1} (Last Item - Editor Trigger)' : 'Notification #${i + 1}', style: const TextStyle(fontWeight: FontWeight.w700, fontSize: 12)),
                          _f('Date Header (e.g. 14 OCT 2026)', n.dateHeader, (v) => n.dateHeader = v),
                          _f('Title', n.title, (v) => n.title = v),
                          _f('Time', n.time, (v) => n.time = v),
                        ]);
                      }),
                      _sec('6. DEVICE SETTINGS'),
                      _box([
                        _f('Device Brand', d.deviceBrand, (v) => d.deviceBrand = v),
                        _f('Device Model', d.deviceModel, (v) => d.deviceModel = v),
                        _f('OS Version', d.osVersion, (v) => d.osVersion = v),
                        _f('Device ID', d.deviceId, (v) => d.deviceId = v),
                      ]),
                      const SizedBox(height: 16),
                      SizedBox(
                        width: double.infinity,
                        height: 50,
                        child: ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: AppColors.primaryBlue),
                          onPressed: () { d.notifyAndSave(); Navigator.pop(context); },
                          child: const Text('Save All Changes', style: TextStyle(color: Colors.white, fontSize: 16)),
                        ),
                      ),
                      const SizedBox(height: 30),
                    ],
                  ),
                ),
              );
            }

            Widget _sec(String t) => Padding(padding: const EdgeInsets.only(top: 14, bottom: 6), child: Text(t, style: const TextStyle(color: AppColors.textGrey, fontSize: 12, fontWeight: FontWeight.w700)));
            Widget _box(List<Widget> c) => Container(margin: const EdgeInsets.only(bottom: 10), padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(14)), child: Column(children: c));
            Widget _f(String l, String init, ValueChanged<String> fn) => Padding(padding: const EdgeInsets.only(bottom: 8), child: TextFormField(initialValue: init, onChanged: fn, decoration: InputDecoration(labelText: l, isDense: true, border: const OutlineInputBorder())));
          }
          '''
              with open(prof_path, "w", encoding="utf-8") as fp:
                  fp.write(pcode)

          # 4. Set App Label to SpaceBasic
          manifest_path = "/tmp/app_build/android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as fp:
              mcode = fp.read().replace('android:label="spacebasic"', 'android:label="SpaceBasic"')
          with open(manifest_path, "w", encoding="utf-8") as fp:
              fp.write(mcode)

          # 5. Generate SpaceBasic Launcher Icon (Pure Python, no pip needed)
          w, h = 192, 192
          rgba = bytearray(w * h * 4)
          def dseg(px, py, x1, y1, x2, y2):
              dx, dy = x2 - x1, y2 - y1
              t = max(0.0, min(1.0, ((px - x1) * dx + (py - y1) * dy) / float(dx * dx + dy * dy)))
              return ((px - (x1 + t * dx)) ** 2 + (py - (y1 + t * dy)) ** 2) ** 0.5
          for y in range(h):
              for x in range(w):
                  i = (y * w + x) * 4
                  if dseg(x, y, 63, 62, 129, 62) <= 16.0: rgba[i:i+4] = b"\x18\x72\xd4\xff"
                  elif dseg(x, y, 63, 130, 129, 130) <= 16.0: rgba[i:i+4] = b"\xd8\x23\x34\xff"
                  elif dseg(x, y, 64, 62, 128, 130) <= 16.0: rgba[i:i+4] = b"\xf5\xa8\x1c\xff"
                  else: rgba[i:i+4] = b"\xff\xff\xff\xff"
          def chunk(t, d): return struct.pack("!I", len(d)) + t + d + struct.pack("!I", zlib.crc32(t + d) & 0xffffffff)
          raw = bytearray()
          for r in range(h):
              raw.append(0)
              raw.extend(rgba[r * w * 4 : (r + 1) * w * 4])
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")
          res_dir = "/tmp/app_build/android/app/src/main/res"
          shutil.rmtree(os.path.join(res_dir, "mipmap-anydpi-v26"), ignore_errors=True)
          for p in glob.glob(os.path.join(res_dir, "mipmap-*", "ic_launcher*.png")):
              with open(p, "wb") as fp: fp.write(png)
          PYEOF

      - name: Build APK Release
        working-directory: /tmp/app_build
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SpaceBasic.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceBasic-APK
          path: /tmp/app_build/build/app/outputs/flutter-apk/SpaceBasic.apk
          
